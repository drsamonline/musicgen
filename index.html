<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MusicGen — opening the site</title>
<meta name="robots" content="noindex" />
<!-- The published site is built from docs/ (landing) + app/ (studio). This
     file only exists so that opening the repository root locally lands
     somewhere sensible. `npm run build` assembles the real thing into _site/. -->
<meta http-equiv="refresh" content="0; url=docs/" />
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #06070b; color: #e8ecff;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a { color: #c6f24e; }
  p { max-width: 40ch; text-align: center; padding: 24px; }
  code { background: #ffffff14; padding: 1px 5px; border-radius: 5px; }
</style>
</head>
<body>
<p>MusicGen's site is built from <code>docs/</code> and <code>app/</code>. <a href="docs/">Open the landing page</a> — or run <code>npm run build</code> to assemble the exact tree that is published.</p>
<script>location.replace('docs/');</script>
</body>
</html>
