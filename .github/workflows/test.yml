name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests (determinism, theory, export, loudness, golden seeds)
        run: node tests/unit/run.js
      - name: Determinism lint (no Math.random / Date.now in pure modules)
        run: node scripts/lint-determinism.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Chrome for Testing, axe-core and pngjs
        run: npm install --no-save puppeteer@23 axe-core pngjs
      - name: Browser tests (real Web Audio, offline render, PWA, themes)
        run: node tests/browser/test.mjs
      - name: Accessibility audit (axe, light + dark)
        run: node scripts/audit.mjs
      # Baselines are rendered on the maintainer's machine; font rasterisation
      # differs on a runner, so this reports rather than blocks. Run it locally
      # (npm run visual) before changing layout or theme tokens.
      - name: Visual regression (informational)
        continue-on-error: true
        run: node scripts/visual.mjs
